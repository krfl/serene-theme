<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap');
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .title { font-size: 56px; font-weight: 700; letter-spacing: -2px; }
      .subtitle { font-size: 20px; font-weight: 400; letter-spacing: -0.5px; }
      .label { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
      .hex { font-family: 'SF Mono', Monaco, 'Courier New', monospace; font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#f5f2ed"/>

  <text x="80" y="100" class="sans title" fill="#3d3a33">SERENE DAY</text>
  <text x="80" y="135" class="sans subtitle" fill="#6e665a">Eye-friendly light theme with warm earth tones</text>

  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="90" height="90" rx="8" fill="#f5f2ed" stroke="#6e665a" stroke-width="1.5"/>
    <text x="45" y="115" class="sans label" fill="#6e665a" text-anchor="middle">Background</text>
    <text x="45" y="135" class="hex" fill="#6e665a" text-anchor="middle" opacity="0.7">#f5f2ed</text>
    <rect x="120" y="0" width="90" height="90" rx="8" fill="#3d3a33"/>
    <text x="165" y="115" class="sans label" fill="#6e665a" text-anchor="middle">Foreground</text>
    <text x="165" y="135" class="hex" fill="#6e665a" text-anchor="middle" opacity="0.7">#3d3a33</text>
    <rect x="240" y="0" width="90" height="90" rx="8" fill="#536f44"/>
    <text x="285" y="115" class="sans label" fill="#6e665a" text-anchor="middle">String</text>
    <text x="285" y="135" class="hex" fill="#6e665a" text-anchor="middle" opacity="0.7">#536f44</text>
    <rect x="360" y="0" width="90" height="90" rx="8" fill="#606b44"/>
    <text x="405" y="115" class="sans label" fill="#6e665a" text-anchor="middle">Keyword</text>
    <text x="405" y="135" class="hex" fill="#6e665a" text-anchor="middle" opacity="0.7">#606b44</text>
    <rect x="480" y="0" width="90" height="90" rx="8" fill="#875f33"/>
    <text x="525" y="115" class="sans label" fill="#6e665a" text-anchor="middle">Function</text>
    <text x="525" y="135" class="hex" fill="#6e665a" text-anchor="middle" opacity="0.7">#875f33</text>
    <rect x="600" y="0" width="90" height="90" rx="8" fill="#7c6340"/>
    <text x="645" y="115" class="sans label" fill="#6e665a" text-anchor="middle">Type</text>
    <text x="645" y="135" class="hex" fill="#6e665a" text-anchor="middle" opacity="0.7">#7c6340</text>
    <rect x="0" y="180" width="90" height="90" rx="8" fill="#9e523c"/>
    <text x="45" y="295" class="sans label" fill="#6e665a" text-anchor="middle">Number</text>
    <text x="45" y="315" class="hex" fill="#6e665a" text-anchor="middle" opacity="0.7">#9e523c</text>
    <rect x="120" y="180" width="90" height="90" rx="8" fill="#5a5240"/>
    <text x="165" y="295" class="sans label" fill="#6e665a" text-anchor="middle">Operator</text>
    <text x="165" y="315" class="hex" fill="#6e665a" text-anchor="middle" opacity="0.7">#5a5240</text>
    <rect x="240" y="180" width="90" height="90" rx="8" fill="#6e665a"/>
    <text x="285" y="295" class="sans label" fill="#6e665a" text-anchor="middle">Comment</text>
    <text x="285" y="315" class="hex" fill="#6e665a" text-anchor="middle" opacity="0.7">#6e665a</text>
    <rect x="360" y="180" width="90" height="90" rx="8" fill="#8b4a38"/>
    <text x="405" y="295" class="sans label" fill="#6e665a" text-anchor="middle">Error</text>
    <text x="405" y="315" class="hex" fill="#6e665a" text-anchor="middle" opacity="0.7">#8b4a38</text>
    <rect x="480" y="180" width="90" height="90" rx="8" fill="#e3d5b8"/>
    <text x="525" y="295" class="sans label" fill="#6e665a" text-anchor="middle">Selection</text>
    <text x="525" y="315" class="hex" fill="#6e665a" text-anchor="middle" opacity="0.7">#e3d5b8</text>
  </g>

  <g transform="translate(820, 200)">
    <text y="30" class="sans label" fill="#6e665a">KEY FEATURES</text>

    <text y="70" class="sans" fill="#3d3a33" font-size="16" font-weight="400">
      <tspan x="0" dy="0">✓ Reduces glare</tspan>
      <tspan x="0" dy="35">✓ Meets WCAG AA</tspan>
      <tspan x="0" dy="35">✓ ~10:1 body-text contrast</tspan>
      <tspan x="0" dy="35">✓ Reduces eye strain</tspan>
      <tspan x="0" dy="35">✓ Warm earth tones</tspan>
      <tspan x="0" dy="35">✓ Perfect for daytime</tspan>
    </text>
  </g>

  <text x="80" y="600" class="sans" fill="#6e665a" font-size="14" opacity="0.7">Available for Wezterm, Helix, VS Code, and Zed</text>
</svg>
