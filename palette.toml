# Serene Theme Palette
# Single source of truth for all color values.
# Names describe the color itself, not its role in a theme.
# Templates map these names to editor-specific elements.

[day]
# Light neutrals
pearl           = "#faf8f4"
aged-paper      = "#f5f2ed"
pale-wheat      = "#ebe6db"
golden-sand     = "#e3d5b8"
light-taupe     = "#d4cfc4"

# Mid neutrals
driftwood       = "#b5ad9a"
sandstone       = "#a89984"
flint           = "#8a826f"
weathered-stone = "#6e665a"
warm-gray       = "#7b7568"
slate           = "#7a7260"
pebble          = "#6d6555"
taupe           = "#6a6350"

# Dark neutrals
dark-slate      = "#5a5549"
charcoal        = "#5a5240"
soot            = "#4a4538"
warm-ink        = "#3d3a33"
deep-soot       = "#35322a"

# Greens
forest          = "#536f44"
olive           = "#606b44"
fern            = "#5c7554"
deep-teal       = "#4a7a68"

# Warm tones
amber           = "#c68a2e"
bronze          = "#875f33"
caramel         = "#7c6340"
toffee          = "#8b6340"
clay            = "#9e523c"
terracotta      = "#8b4a38"

# Meadow hues (full hue wheel, muted to the same lightness)
